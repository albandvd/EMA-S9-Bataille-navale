server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly exige le type MIME application/wasm pour la compilation en streaming ;
    # déjà fourni par /etc/nginx/mime.types (inclus dans nginx.conf) — ne pas redéclarer un bloc
    # `types {}` ici : il remplacerait toute la table MIME par défaut au lieu de la compléter,
    # et tout le reste (html, css, js…) retomberait sur application/octet-stream (téléchargement
    # forcé au lieu de l'affichage dans le navigateur).

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        application/octet-stream
        font/woff2;

    # Fichiers versionnés par le fingerprint Blazor (ex. _framework/*) : cache long terme.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # appsettings.json est régénéré à chaque démarrage du conteneur (API_BASE_URL) :
    # jamais de cache, sous peine de servir une ancienne URL d'API après un redéploiement.
    location = /appsettings.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Routage côté client (NavigationManager) : toute route inconnue retombe sur index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
